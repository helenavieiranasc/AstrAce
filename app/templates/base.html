<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Ciência Delas{% endblock %}</title>
  <meta name="description" content="{% block descricao %}Projetos, eventos e vagas para mulheres e meninas na ciência e tecnologia.{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  {% block estilos %}{% endblock %}
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <header class="topo">
    <a class="topo__marca" href="/">Ciência Delas</a>
    <nav class="topo__nav" aria-label="Principal">
      <ul>
        <li><a href="/mural" {% if request.path.startswith('/mural') %}aria-current="page"{% endif %}>Mural</a></li>
        <li><a href="/eventos" {% if request.path.startswith('/eventos') %}aria-current="page"{% endif %}>Eventos</a></li>
        <li><a href="/vagas" {% if request.path.startswith('/vagas') %}aria-current="page"{% endif %}>Vagas</a></li>
        <li><a href="/noticias" {% if request.path.startswith('/noticias') %}aria-current="page"{% endif %}>Notícias</a></li>
        <li><a href="/passaporte" {% if request.path.startswith('/passaporte') %}aria-current="page"{% endif %}>Passaporte</a></li>
      </ul>
    </nav>
    {% block acao_topo %}
    <a class="botao botao--primario topo__acao" href="/mural/novo">Publicar projeto</a>
    {% endblock %}
  </header>

  <main id="conteudo">
    {% block conteudo %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
